<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AIB Graph</title>
    <!--
      The server URL is chosen at runtime, so connect-src can't name it here; the main process
      (src/main/security.ts) cancels any request to a host other than the configured server.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
