[project]
name = "aib-graph-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.7.1",
    "google-genai>=2.32.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.2",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",
    "reportlab>=5.1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::jwt.warnings.InsecureKeyLengthWarning"]
